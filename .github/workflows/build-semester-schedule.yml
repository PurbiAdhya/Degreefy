name: Build semester schedule CSV

on:
  push:
    paths:
      - "data/source/*.pdf"
      - "tools/convert_schedule_pdf.py"
      - "data/courses.csv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber
      - name: Convert newest schedule PDF
        shell: bash
        run: |
          PDF=$(find data/source -maxdepth 1 -name '*.pdf' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          test -n "$PDF"
          python tools/convert_schedule_pdf.py "$PDF" --output data/semester_schedule.csv --catalog data/courses.csv
      - name: Commit generated CSV
        shell: bash
        run: |
          if git diff --quiet -- data/semester_schedule.csv; then
            echo "No schedule changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/semester_schedule.csv
          git commit -m "Update semester schedule data"
          git push
