<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Degreefy</title>

  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #f7f5fc;
    }

    #loadingMessage,
    #errorMessage {
      box-sizing: border-box;
      max-width: 720px;
      margin: 80px auto;
      padding: 24px;
      border: 1px solid #ded8ef;
      border-radius: 18px;
      background: white;
      color: #302a49;
      line-height: 1.5;
    }

    #errorMessage {
      display: none;
      border-color: #e9b9b9;
      color: #7a2525;
    }
  </style>
</head>

<body>
  <div id="loadingMessage">
    Loading Degreefy…
  </div>

  <div id="errorMessage"></div>

  <script>
    (async function loadUpdatedDegreefy() {
      const BASE_HTML_FILE = "./index.html";

      const loadingMessage = document.getElementById("loadingMessage");
      const errorMessage = document.getElementById("errorMessage");

      function showError(message) {
        loadingMessage.style.display = "none";
        errorMessage.style.display = "block";
        errorMessage.textContent = message;
      }

      try {
        const response = await fetch(
          BASE_HTML_FILE + "?version=" + Date.now(),
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error(
            BASE_HTML_FILE + " returned HTTP " + response.status
          );
        }

        let html = await response.text();

        /*
          Fix spacing between the circular year marker and the
          Year 1, Year 2, Year 3, and Year 4 labels.
        */
        const yearSpacingCSS = String.raw`
          <style id="degreefy-final-layout-fixes">
            .planner-year-stop {
              box-sizing: border-box;
              padding-left: 62px !important;
            }

            .planner-year-stop::before {
              left: 16px !important;
            }

            .planner-year-stop .planner-year-label,
            .planner-year-stop .planner-year-range {
              left: auto !important;
              margin-left: 0 !important;
              padding-left: 0 !important;
              transform: none !important;
            }

            @media (max-width: 980px) {
              .planner-year-stop {
                padding: 14px !important;
              }

              .planner-year-stop::before {
                display: none !important;
              }
            }
          </style>
        `;

        if (html.includes("</head>")) {
          html = html.replace(
            "</head>",
            yearSpacingCSS + "\n</head>"
          );
        } else {
          throw new Error(
            "The source HTML does not contain a closing head tag."
          );
        }

        /*
          This patch is inserted after Degreefy's functions have been
          declared but before initialize() runs.

          offerings.csv decides which course codes are displayed.
          courses.csv supplies the catalog information for each code.
        */
        const dataJoinPatch = String.raw`
          /* =========================================================
             FINAL CSV COURSE/OFFERING JOIN
             ========================================================= */

          function normalizeCourseCode(value) {
            return String(value || "")
              .replace(/^\uFEFF/, "")
              .trim()
              .replace(/\s+/g, " ")
              .toUpperCase();
          }

          function catalogCreditValue(value) {
            const match = String(value || "").match(/\d+(?:\.\d+)?/);
            return match ? Number(match[0]) : 0;
          }

          function normalizeCourseRelationGroups(value) {
            return parseRelationGroups(value)
              .map(function (group) {
                return group
                  .map(normalizeCourseCode)
                  .filter(Boolean);
              })
              .filter(function (group) {
                return group.length > 0;
              });
          }

          buildDataFromCSV = function buildDataFromCSV(datasets) {
            const courses = {};
            const bundles = {};

            /*
              courses.csv is the authoritative source for:
              title, credits, area, prerequisites, and corequisites.
            */
            datasets.courses.forEach(function (row) {
              const code = normalizeCourseCode(row.code);
              if (!code) return;

              const prereqGroups =
                normalizeCourseRelationGroups(row.prerequisites);

              const coreqGroups =
                normalizeCourseRelationGroups(row.corequisites);

              const info = {
                title:
                  row.title ||
                  row.course_title ||
                  row.course_name ||
                  row.name ||
                  row.long_title ||
                  code,

                credits: catalogCreditValue(
                  row.credits || row.credit_hours
                ),

                area:
                  row.area ||
                  getPrefix(code) ||
                  "Other",

                prereq: prereqGroups.flat(),
                coreq: coreqGroups.flat(),
                prereqGroups: prereqGroups,
                coreqGroups: coreqGroups
              };

              const isBundle =
                String(row.is_bundle || "")
                  .trim()
                  .toLowerCase() === "true";

              if (isBundle) {
                bundles[code] = Object.assign({}, info, {
                  code: row.display_code || code
                });
              } else {
                courses[code] = info;
              }
            });

            const programs = {
              majors: {},
              minors: {}
            };

            datasets.programs.forEach(function (row) {
              if (!row.program_id || !row.name) return;

              const type =
                String(row.type || "major")
                  .toLowerCase()
                  .startsWith("minor")
                  ? "minors"
                  : "majors";

              programs[type][row.program_id] = {
                label: row.name,
                area: row.area || "Other",
                totalCredits: Number(row.total_credits || 0),
                courses: []
              };
            });

            datasets.requirements.forEach(function (row) {
              const target =
                programs.majors[row.program_id] ||
                programs.minors[row.program_id];

              if (!target) return;

              const criteria = criteriaFromRow(row);
              const courseCode =
                normalizeCourseCode(row.course_code);

              const requirementCode =
                row.requirement_id || courseCode;

              const catalogCourse =
                courses[courseCode] ||
                bundles[courseCode] ||
                {};

              target.courses.push([
                requirementCode,

                row.title ||
                  row.course_title ||
                  row.course_name ||
                  row.name ||
                  catalogCourse.title ||
                  courseCode ||
                  requirementCode,

                catalogCreditValue(
                  row.credits ||
                  row.credit_hours ||
                  catalogCourse.credits
                ),

                row.category ||
                  (criteria ? "Choice" : "Required"),

                criteria
              ]);
            });

            const core = datasets.core
              .map(function (row) {
                return [
                  row.requirement_id,
                  row.label || row.requirement_id,
                  row.title ||
                    row.label ||
                    row.requirement_id,
                  catalogCreditValue(row.credits),
                  criteriaFromRow(row)
                ];
              })
              .filter(function (row) {
                return Boolean(row[0]);
              });

            const offerings = {};
            const current = {};

            /*
              offerings.csv is the authoritative source for which
              course codes are offered.
            */
            datasets.offerings.forEach(function (row) {
              const code = normalizeCourseCode(row.code);
              const rawTerm = String(row.term || "").trim();

              if (!code || !rawTerm) return;

              const term =
                rawTerm.charAt(0).toUpperCase() +
                rawTerm.slice(1).toLowerCase();

              const status =
                String(row.status || "typical")
                  .trim()
                  .toLowerCase();

              const catalogInfo =
                courses[code] ||
                bundles[code] ||
                {};

              /*
                Prefer the academic area in courses.csv. The area in
                offerings.csv is only a fallback.
              */
              const area =
                catalogInfo.area ||
                row.area ||
                getPrefix(code) ||
                "Other";

              if (status === "current") {
                const key =
                  term + " " +
                  (String(row.year || "").trim() ||
                    START_TERM.year);

                if (!current[key]) {
                  current[key] = [];
                }

                if (!current[key].includes(code)) {
                  current[key].push(code);
                }
              } else {
                if (!offerings[area]) {
                  offerings[area] = {
                    Fall: [],
                    Spring: [],
                    Summer: []
                  };
                }

                if (!offerings[area][term]) {
                  offerings[area][term] = [];
                }

                if (!offerings[area][term].includes(code)) {
                  offerings[area][term].push(code);
                }
              }
            });

            Object.values(offerings).forEach(function (terms) {
              Object.values(terms).forEach(function (codes) {
                codes.sort();
              });
            });

            Object.values(current).forEach(function (codes) {
              codes.sort();
            });

            return {
              courses: courses,
              bundles: bundles,
              programs: programs,
              core: core,
              offerings: offerings,
              current: current
            };
          };

          courseInfo = function courseInfo(value) {
            const originalCode = isOfferedCourseId(value)
              ? offeredCodeFromId(value)
              : value;

            const code = normalizeCourseCode(originalCode);

            return (
              COURSE_CATALOG[code] ||
              BUNDLES[code] ||
              {}
            );
          };

          makeOfferedItem = function makeOfferedItem(value) {
            const code = normalizeCourseCode(value);
            const info = courseInfo(code);

            return {
              id: offeredCourseId(code),
              rawCode: code,
              code: BUNDLES[code]
                ? BUNDLES[code].code
                : code,

              title:
                info.title ||
                "Course information unavailable",

              credits: catalogCreditValue(info.credits),

              area:
                info.area ||
                getPrefix(code) ||
                "Other",

              category: "Other offered course",
              prereq: info.prereq || [],
              coreq: info.coreq || [],
              kind: "offered"
            };
          };

          normalizeScheduleSection =
            function normalizeScheduleSection(row) {
              const courseCode =
                normalizeCourseCode(row.course_code);

              const catalogInfo =
                COURSE_CATALOG[courseCode] ||
                BUNDLES[courseCode] ||
                {};

              return {
                term: row.term || "",
                term_code: row.term_code || "",
                start_date: row.start_date || "",
                end_date: row.end_date || "",

                section_id:
                  row.section_id ||
                  courseCode.replace(/\s/g, "") +
                    "-" +
                    (row.section || "01"),

                course_code: courseCode,
                section: row.section || "01",

                course_title:
                  row.course_title ||
                  catalogInfo.title ||
                  courseCode ||
                  "Course",

                credit_hours: catalogCreditValue(
                  row.credit_hours ||
                  catalogInfo.credits
                ),

                days: String(row.days || "")
                  .replace(/\s/g, ""),

                begin_time: row.begin_time || "",
                end_time: row.end_time || "",

                modality:
                  row.modality ||
                  (
                    row.building === "OLC" ||
                    row.room === "OLC"
                      ? "Online"
                      : "In person"
                  ),

                building: row.building || "",
                room: row.room || "",

                location:
                  row.location ||
                  [row.building, row.room]
                    .filter(Boolean)
                    .join(" "),

                instructor: row.instructor || "",
                comments: row.comments || "",
                registered: Number(row.registered || 0),
                capacity: Number(row.capacity || 0)
              };
            };

          refreshDerivedCollections =
            function refreshDerivedCollections() {
              const typicalCodes =
                Object.values(OFFERINGS)
                  .flatMap(function (terms) {
                    return []
                      .concat(terms.Fall || [])
                      .concat(terms.Spring || [])
                      .concat(terms.Summer || []);
                  });

              const currentCodes =
                Object.values(CURRENT_OFFERINGS)
                  .flat();

              const scheduledCodes =
                (SEMESTER_SECTIONS || [])
                  .map(function (section) {
                    return normalizeCourseCode(
                      section.course_code
                    );
                  })
                  .filter(Boolean);

              /*
                Do not add every code from courses.csv to the course
                bank. Only use codes found in offerings.csv or the
                published semester schedule.
              */
              OFFERED_CODES = Array.from(
                new Set(
                  []
                    .concat(typicalCodes)
                    .concat(currentCodes)
                    .concat(scheduledCodes)
                    .map(normalizeCourseCode)
                    .filter(Boolean)
                )
              ).sort();

              const missingCatalogCodes =
                OFFERED_CODES.filter(function (code) {
                  return (
                    !COURSE_CATALOG[code] &&
                    !BUNDLES[code]
                  );
                });

              if (missingCatalogCodes.length) {
                console.warn(
                  "The following offering codes are missing from courses.csv:",
                  missingCatalogCodes
                );
              }

              const areas = Array.from(
                new Set(
                  OFFERED_CODES
                    .map(function (code) {
                      return courseGroup(
                        makeOfferedItem(code)
                      );
                    })
                    .filter(Boolean)
                )
              ).sort();

              COURSE_GROUP_ORDER =
                areas.length
                  ? areas
                  : ["Other"];

              COURSE_FILTERS = [
                {
                  id: "all",
                  label: "All"
                },
                {
                  id: "current",
                  label: "Current semester",
                  current: true
                }
              ].concat(
                areas.map(function (area, index) {
                  return {
                    id: "area-" + index,
                    label: area,
                    area: area
                  };
                })
              );

              const activeFilterExists =
                COURSE_FILTERS.some(function (filter) {
                  return filter.id === activeCourseFilter;
                });

              if (!activeFilterExists) {
                activeCourseFilter = "all";
              }
            };

          /* =========================================================
             END FINAL CSV COURSE/OFFERING JOIN
             ========================================================= */
        `;

        const initializeMarker =
          "loadState(); setupEvents(); initialize();";

        if (!html.includes(initializeMarker)) {
          throw new Error(
            "The Degreefy initialization marker was not found."
          );
        }

        html = html.replace(
          initializeMarker,
          dataJoinPatch +
            "\n\n" +
            initializeMarker
        );

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error(error);

        showError(
          "Degreefy could not be loaded. Keep this index.html, " +
          "index(36).html, and the data folder in the same " +
          "repository folder. Details: " +
          error.message
        );
      }
    })();
  </script>
</body>
</html>
